[server]
host = "0.0.0.0"
port = 8080
access_password_env = "MDA_ACCESS_PASSWORD"
# HTTP is suitable only for localhost/private networks or behind an HTTPS proxy.

[database]
url_env = "DATABASE_URL"

[redis]
url_env = "REDIS_URL"

[artifacts]
endpoint = "http://localhost:9000"
bucket = "mda-artifacts"
region = "us-east-1"
access_key_env = "S3_ACCESS_KEY_ID"
secret_key_env = "S3_SECRET_ACCESS_KEY"

[preview]
signing_key_env = "MDA_PREVIEW_SIGNING_KEY"
ttl_seconds = 3600

[auth]
mode = "password"
tenant_id = "local"
user_id = "local-admin"

# Used when auth.mode = "oidc".
[oidc]
issuer = "https://identity.example"
audience = "mda"
jwks_url = "https://identity.example/.well-known/jwks.json"

[agent]
lease_ms = 30000
workers = 8
internal_token_env = "INTERNAL_AGENT_TOKEN"
control_plane_url = "http://localhost:8080"
workspace_root = "./var/agent"
skills_root = "./apps/agent/skills"

[agent.model]
provider = "openai-compatible"
model = "your-model-id"
base_url = "https://api.example/v1"
api_key_env = "MDA_MODEL_API_KEY"
# Use api_key_file = "/run/secrets/model_api_key" instead in Compose.
