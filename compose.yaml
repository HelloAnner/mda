name: mda

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: mda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mda"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [control-net]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: >-
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [control-net, agent-net]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [control-net]
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-mda-artifacts}
    depends_on:
      minio:
        condition: service_healthy
    networks: [control-net]
    restart: "no"

  data-fixture:
    image: mda-datasource:0.1.0
    build:
      context: .
      dockerfile: docker/mda-datasource.Dockerfile
    command: ["bun", "apps/data-source-service/src/fixture.ts"]
    networks: [data-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8090/health');process.exit(r.ok?0:1)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  data-source-migrate:
    image: mda-datasource:0.1.0
    build:
      context: .
      dockerfile: docker/mda-datasource.Dockerfile
    command: ["bun", "apps/data-source-service/src/migrate.ts"]
    environment:
      DATA_SOURCE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mda
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  jdbc-runner:
    image: mda-jdbc-runner:0.1.0
    build:
      context: .
      dockerfile: docker/mda-jdbc-runner.Dockerfile
    environment:
      JDBC_RUNNER_TOKEN: ${JDBC_RUNNER_TOKEN:?set JDBC_RUNNER_TOKEN}
    networks: [control-net, data-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    restart: unless-stopped

  datasource:
    image: mda-datasource:0.1.0
    environment:
      DATA_SOURCE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mda
      DATA_SOURCE_INTERNAL_TOKEN: ${DATA_SOURCE_INTERNAL_TOKEN:?set DATA_SOURCE_INTERNAL_TOKEN}
      JDBC_RUNNER_URL: http://jdbc-runner:8082
      JDBC_RUNNER_TOKEN: ${JDBC_RUNNER_TOKEN:?set JDBC_RUNNER_TOKEN}
      DATA_SOURCE_SECRETS_ROOT: /run/secrets
    depends_on:
      data-source-migrate:
        condition: service_completed_successfully
      data-fixture:
        condition: service_healthy
      jdbc-runner:
        condition: service_healthy
    networks: [control-net, data-net, connector-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./var/data-source-secrets:/run/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8081/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    restart: unless-stopped

  main-migrate:
    image: mda-main:0.1.0
    build:
      context: .
      dockerfile: docker/mda-main.Dockerfile
    command: ["bun", "apps/control-plane/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mda
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  main:
    image: mda-main:0.1.0
    environment:
      MDA_CONFIG: /app/mda.example.toml
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mda
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_AGENT_TOKEN: ${INTERNAL_AGENT_TOKEN:?set INTERNAL_AGENT_TOKEN}
      MDA_ACCESS_PASSWORD: ${MDA_ACCESS_PASSWORD:?set MDA_ACCESS_PASSWORD}
      MDA_PREVIEW_SIGNING_KEY: ${MDA_PREVIEW_SIGNING_KEY:?set MDA_PREVIEW_SIGNING_KEY}
      MDA_PREVIEW_TTL_SECONDS: ${MDA_PREVIEW_TTL_SECONDS:-3600}
      MDA_SHARE_SIGNING_KEY: ${MDA_SHARE_SIGNING_KEY:?set MDA_SHARE_SIGNING_KEY}
      DATA_SOURCE_INTERNAL_URL: http://datasource:8081
      DATA_SOURCE_INTERNAL_TOKEN: ${DATA_SOURCE_INTERNAL_TOKEN:?set DATA_SOURCE_INTERNAL_TOKEN}
      MDA_AUTH_MODE: password
      MDA_LOCAL_TENANT: local
      MDA_LOCAL_USER: local-admin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-mda-artifacts}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    depends_on:
      main-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      datasource:
        condition: service_healthy
    ports:
      - "${MDA_BIND_ADDRESS:-127.0.0.1}:${MDA_PORT:-8356}:8080"
    networks: [edge-net, control-net, agent-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8080/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    init: true
    restart: unless-stopped

  agent:
    image: mda-agent:0.1.0
    build:
      context: .
      dockerfile: docker/mda-agent.Dockerfile
    environment:
      MDA_CONFIG: /app/mda.example.toml
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_AGENT_TOKEN: ${INTERNAL_AGENT_TOKEN:?set INTERNAL_AGENT_TOKEN}
      CONTROL_PLANE_INTERNAL_URL: http://main:8080
      MDA_AGENT_WORKSPACE_ROOT: /workspace
      MDA_AGENT_WORKERS: ${MDA_AGENT_WORKERS:-8}
      MDA_MODEL_PROVIDER: mda-llm
      MDA_MODEL: ${LLM_MODEL_NAME:?set LLM_MODEL_NAME}
      MDA_MODEL_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL}
      MODEL_API_KEY_FILE: /run/secrets/model_api_key
    secrets: [model_api_key]
    depends_on:
      main:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - agent-workspace:/workspace
    networks: [agent-net]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=512m,exec,nosuid
      - /home/bun/.cache:size=512m,nosuid,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for f in /proc/[0-9]*/cmdline; do grep -aq 'apps/agent/src/worker.ts' \"$$f\" && exit 0; done; exit 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    pids_limit: 512
    init: true
    restart: unless-stopped

networks:
  edge-net: {}
  control-net:
    internal: true
  agent-net: {}
  data-net:
    internal: true
  connector-net: {}

volumes:
  postgres-data:
    name: mda-postgres-data
  redis-data:
    name: mda-redis-data
  minio-data:
    name: mda-minio-data
  agent-workspace:
    name: mda-agent-workspace

secrets:
  model_api_key:
    file: ${MDA_MODEL_API_KEY_FILE:-./var/secrets/model_api_key}
